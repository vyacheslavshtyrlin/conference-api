stages:
  - validate
  - build
  - deploy
  - cleanup

variables:
  DEPLOY_BRANCH: "main"
  IMAGE_ENV_VAR: "BE_IMAGE"
  IMAGE_NAME: "conference-be"
  NETWORK_NAME: "conference-net"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - 158.160.25.200

validate:
  stage: validate
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  script:
    - export ${IMAGE_ENV_VAR}="${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker compose -f docker-compose.yml build
    - docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

deploy:
  stage: deploy
  environment:
    name: prod
  script:
    - |
      if [ -n "$DEPLOY_ENV_PROD" ] && [ -f "$DEPLOY_ENV_PROD" ]; then
        cp -f "$DEPLOY_ENV_PROD" .env
      else
        cp -f .env.example .env
      fi
    - export ${IMAGE_ENV_VAR}="${IMAGE_NAME}:latest"
    - docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"
    - docker compose -f docker-compose.yml up -d --no-build --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'

cleanup:
  stage: cleanup
  script:
    - docker container prune --force --filter "until=24h"
    - docker image prune --force --filter "until=24h"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: always
