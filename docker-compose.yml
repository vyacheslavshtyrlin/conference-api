name: conference-be

services:
  api:
    image: ${BE_IMAGE:-conference-be:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL is required}
      MEDIA_NODE_ID: ${MEDIA_NODE_ID:-local}
      SIGNALING_PUBLIC_URL: ${SIGNALING_PUBLIC_URL:?SIGNALING_PUBLIC_URL is required}
      JOIN_TOKEN_SECRET: ${JOIN_TOKEN_SECRET:?JOIN_TOKEN_SECRET is required}
      JOIN_TOKEN_TTL_SECONDS: ${JOIN_TOKEN_TTL_SECONDS:-300}
      ROOM_SESSION_TOKEN_SECRET:
      AUTH_COOKIE_ENABLED: ${AUTH_COOKIE_ENABLED:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-conference_identity}
      AUTH_COOKIE_JWT_ISSUER:
      AUTH_COOKIE_JWT_AUDIENCE:
      AUTH_COOKIE_JWT_HS256_SECRET:
      AUTH_LOGIN_URL:
      INTEGRATION_API_ENABLED: ${INTEGRATION_API_ENABLED:-false}
      INTEGRATION_JWT_CREDENTIALS_JSON:
      INTEGRATION_JWT_MAX_TTL_SECONDS: ${INTEGRATION_JWT_MAX_TTL_SECONDS:-900}
      INTEGRATION_RATE_LIMIT_WINDOW_SECONDS: ${INTEGRATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      INTEGRATION_RATE_LIMIT_MAX_REQUESTS: ${INTEGRATION_RATE_LIMIT_MAX_REQUESTS:-60}
    restart: unless-stopped
    networks:
      default:
      conference-net:
        aliases:
          - api

networks:
  conference-net:
    external: true
